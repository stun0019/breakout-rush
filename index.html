<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Breakout Rush</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      touch-action: none;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #gameCanvas {
      display: block;

      width: min(100vw, calc(100vh * 9 / 16));
      height: min(100vh, calc(100vw * 16 / 9));

      background: #050914;

      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
  </style>
</head>

<body>

<canvas
  id="gameCanvas"
  width="720"
  height="1280"
></canvas>

<script>

/* =========================================================
   Canvas
========================================================= */

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

const GAME_WIDTH = 720;
const GAME_HEIGHT = 1280;


/* =========================================================
   Layout
========================================================= */

/*
  遊戲區
  Y = 0 ~ 1119

  手指控制區
  Y = 1120 ~ 1279
*/

const CONTROL_ZONE_Y = 1120;
const CONTROL_ZONE_HEIGHT = 160;


/*
  BG 原圖的遊戲區 / 控制區分界比例。

  目前 art/BG/BG.png
  原圖的金屬分隔位置約在高度 79%。
*/
const BG_SOURCE_SPLIT_RATIO = 0.7895;


/* =========================================================
   Assets
========================================================= */

const assets = {};


function loadImage(name, src) {

  return new Promise((resolve, reject) => {

    const img = new Image();

    img.onload = () => {

      assets[name] = img;

      resolve();

    };

    img.onerror = () => {

      reject(
        new Error(
          `無法載入素材：${src}`
        )
      );

    };

    img.src = src;

  });

}


/* =========================================================
   Load Assets
========================================================= */

Promise.all([

  loadImage(
    "bg",
    "art/BG/BG.png"
  ),

  loadImage(
    "ball",
    "art/normal_ball.png"
  ),

  loadImage(
    "paddle",
    "art/character.png"
  ),

  loadImage(
    "red",
    "art/red.png"
  ),

  loadImage(
    "yellow",
    "art/yellow.png"
  ),

  loadImage(
    "green",
    "art/green.png"
  ),

  loadImage(
    "blue",
    "art/blue.png"
  ),

  loadImage(
    "purple",
    "art/purple.png"
  )

])

.then(() => {

  initGame();

})

.catch((error) => {

  console.error(error);

  drawLoadError();

});


/* =========================================================
   Game State
========================================================= */

let running = false;

let score = 0;

let lastTime = 0;


/* =========================================================
   Ball
========================================================= */

const ball = {

  width: 32,
  height: 32,

  x:
    GAME_WIDTH / 2 -
    16,

  y: 900,

  vx: 220,
  vy: -390

};


/*
  球基本速度
  px / 秒
*/

const BALL_SPEED = 450;


/* =========================================================
   Paddle
========================================================= */

const paddle = {

  width: 160,
  height: 32,

  x:
    GAME_WIDTH / 2 -
    80,

  /*
    控制區上方
  */
  y: 1060

};


/* =========================================================
   Bricks
========================================================= */

const BRICK_WIDTH = 112;
const BRICK_HEIGHT = 48;

const BRICK_GAP_X = 12;
const BRICK_GAP_Y = 14;

const BRICK_COLUMNS = 5;
const BRICK_ROWS = 4;

const BRICK_START_Y = 170;


const brickTypes = [
  "red",
  "yellow",
  "green",
  "blue",
  "purple"
];


const totalBrickWidth =

  BRICK_COLUMNS *
  BRICK_WIDTH +

  (
    BRICK_COLUMNS -
    1
  ) *

  BRICK_GAP_X;


const BRICK_START_X =

  (
    GAME_WIDTH -
    totalBrickWidth
  ) / 2;


let bricks = [];


/* =========================================================
   Create Bricks
========================================================= */

function createBricks() {

  bricks = [];

  for (
    let row = 0;
    row < BRICK_ROWS;
    row++
  ) {

    for (
      let col = 0;
      col < BRICK_COLUMNS;
      col++
    ) {

      bricks.push({

        x:
          BRICK_START_X +
          col *
          (
            BRICK_WIDTH +
            BRICK_GAP_X
          ),

        y:
          BRICK_START_Y +
          row *
          (
            BRICK_HEIGHT +
            BRICK_GAP_Y
          ),

        width:
          BRICK_WIDTH,

        height:
          BRICK_HEIGHT,

        type:
          brickTypes[
            (
              row +
              col
            )
            %
            brickTypes.length
          ],

        active: true

      });

    }

  }

}


/* =========================================================
   Init
========================================================= */

function initGame() {

  score = 0;

  paddle.x =
    GAME_WIDTH / 2 -
    paddle.width / 2;

  createBricks();

  resetBall();

  running = true;

  lastTime = 0;

  requestAnimationFrame(
    gameLoop
  );

}


/* =========================================================
   Reset Ball
========================================================= */

function resetBall() {

  ball.x =
    GAME_WIDTH / 2 -
    ball.width / 2;

  ball.y = 900;


  /*
    每次重新發球
    左右方向隨機
  */

  const direction =
    Math.random() < 0.5
      ? -1
      : 1;


  ball.vx =
    210 *
    direction;

  ball.vy = -398;

}


/* =========================================================
   Main Loop
========================================================= */

function gameLoop(time) {

  if (!running) {
    return;
  }


  /*
    Delta Time

    避免 60Hz / 120Hz
    遊戲速度不同
  */

  let deltaTime = 0;

  if (lastTime !== 0) {

    deltaTime =
      (
        time -
        lastTime
      ) / 1000;

  }

  lastTime = time;


  /*
    避免切換分頁回來
    delta 過大
  */

  deltaTime =
    Math.min(
      deltaTime,
      1 / 30
    );


  update(deltaTime);

  draw();


  requestAnimationFrame(
    gameLoop
  );

}


/* =========================================================
   Update
========================================================= */

function update(deltaTime) {

  if (
    deltaTime <= 0
  ) {
    return;
  }


  const previousX =
    ball.x;

  const previousY =
    ball.y;


  /* =======================================================
     Move Ball
  ======================================================= */

  ball.x +=
    ball.vx *
    deltaTime;

  ball.y +=
    ball.vy *
    deltaTime;


  /* =======================================================
     Left Wall
  ======================================================= */

  if (
    ball.x <= 0
  ) {

    ball.x = 0;

    ball.vx =
      Math.abs(
        ball.vx
      );

  }


  /* =======================================================
     Right Wall
  ======================================================= */

  if (
    ball.x +
    ball.width >=
    GAME_WIDTH
  ) {

    ball.x =
      GAME_WIDTH -
      ball.width;

    ball.vx =
      -Math.abs(
        ball.vx
      );

  }


  /* =======================================================
     Top Wall
  ======================================================= */

  if (
    ball.y <= 0
  ) {

    ball.y = 0;

    ball.vy =
      Math.abs(
        ball.vy
      );

  }


  /* =======================================================
     Paddle Collision
  ======================================================= */

  if (

    ball.vy > 0 &&

    rectangleCollision(
      ball,
      paddle
    )

  ) {

    /*
      防止卡入擋板
    */

    ball.y =
      paddle.y -
      ball.height;


    const ballCenter =

      ball.x +
      ball.width / 2;


    const paddleCenter =

      paddle.x +
      paddle.width / 2;


    /*
      -1 = 最左
       0 = 中間
       1 = 最右
    */

    let hitPosition =

      (
        ballCenter -
        paddleCenter
      )

      /

      (
        paddle.width / 2
      );


    hitPosition =
      clamp(
        hitPosition,
        -1,
        1
      );


    /*
      最大約 65 度
    */

    const maxAngle =
      Math.PI *
      0.36;


    const angle =
      hitPosition *
      maxAngle;


    ball.vx =
      Math.sin(
        angle
      ) *
      BALL_SPEED;


    ball.vy =
      -Math.cos(
        angle
      ) *
      BALL_SPEED;


    /*
      避免完全垂直
    */

    if (
      Math.abs(
        ball.vx
      ) < 45
    ) {

      ball.vx =
        ball.vx < 0
          ? -45
          : 45;

    }

  }


  /* =======================================================
     Brick Collision
  ======================================================= */

  for (
    const brick of bricks
  ) {

    if (
      !brick.active
    ) {
      continue;
    }


    if (
      !rectangleCollision(
        ball,
        brick
      )
    ) {
      continue;
    }


    /*
      磚塊消失
    */

    brick.active = false;

    score += 100;


    /*
      判斷球是從哪一側
      撞到磚塊
    */

    resolveBrickCollision(
      brick,
      previousX,
      previousY
    );


    /*
      每 frame 最多處理一顆磚塊
    */

    break;

  }


  /* =======================================================
     Ball Lost
  ======================================================= */

  /*
    球進入底部操作區
    = 掉球
  */

  if (
    ball.y +
    ball.height >=
    CONTROL_ZONE_Y
  ) {

    resetBall();

  }


  /* =======================================================
     Stage Clear
  ======================================================= */

  const hasBrick =

    bricks.some(
      brick =>
        brick.active
    );


  if (
    !hasBrick
  ) {

    createBricks();

    resetBall();

  }

}


/* =========================================================
   Brick Collision Resolve
========================================================= */

function resolveBrickCollision(
  brick,
  previousX,
  previousY
) {

  const previousLeft =
    previousX;

  const previousRight =
    previousX +
    ball.width;

  const previousTop =
    previousY;

  const previousBottom =
    previousY +
    ball.height;


  const brickLeft =
    brick.x;

  const brickRight =
    brick.x +
    brick.width;

  const brickTop =
    brick.y;

  const brickBottom =
    brick.y +
    brick.height;


  /*
    從上方撞磚塊
  */

  if (
    previousBottom <=
    brickTop
  ) {

    ball.y =
      brickTop -
      ball.height;

    ball.vy =
      -Math.abs(
        ball.vy
      );

    return;

  }


  /*
    從下方撞磚塊
  */

  if (
    previousTop >=
    brickBottom
  ) {

    ball.y =
      brickBottom;

    ball.vy =
      Math.abs(
        ball.vy
      );

    return;

  }


  /*
    從左側撞
  */

  if (
    previousRight <=
    brickLeft
  ) {

    ball.x =
      brickLeft -
      ball.width;

    ball.vx =
      -Math.abs(
        ball.vx
      );

    return;

  }


  /*
    從右側撞
  */

  if (
    previousLeft >=
    brickRight
  ) {

    ball.x =
      brickRight;

    ball.vx =
      Math.abs(
        ball.vx
      );

    return;

  }


  /*
    特殊重疊情況
    fallback
  */

  ball.vy *= -1;

}


/* =========================================================
   Rectangle Collision
========================================================= */

function rectangleCollision(
  a,
  b
) {

  return (

    a.x <
    b.x +
    b.width &&

    a.x +
    a.width >
    b.x &&

    a.y <
    b.y +
    b.height &&

    a.y +
    a.height >
    b.y

  );

}


/* =========================================================
   Clamp
========================================================= */

function clamp(
  value,
  min,
  max
) {

  return Math.max(
    min,
    Math.min(
      max,
      value
    )
  );

}


/* =========================================================
   Draw
========================================================= */

function draw() {

  ctx.clearRect(
    0,
    0,
    GAME_WIDTH,
    GAME_HEIGHT
  );


  drawBackground();

  drawBricks();

  drawBall();

  drawPaddle();

  drawScore();

}


/* =========================================================
   Background
========================================================= */

function drawBackground() {

  const bg =
    assets.bg;


  if (
    !bg
  ) {
    return;
  }


  /*
    Pixel Art BG
    關閉圖片平滑
  */

  ctx.imageSmoothingEnabled =
    false;


  const sourceWidth =
    bg.naturalWidth;

  const sourceHeight =
    bg.naturalHeight;


  /*
    找 BG 原圖裡
    上方遊戲區與下方控制區的分界
  */

  const sourceSplitY =

    Math.floor(

      sourceHeight *
      BG_SOURCE_SPLIT_RATIO

    );


  /* =======================================================
     BG 上半部
     拉到 Y = 0 ~ 1120
  ======================================================= */

  ctx.drawImage(

    bg,

    0,
    0,

    sourceWidth,
    sourceSplitY,

    0,
    0,

    GAME_WIDTH,
    CONTROL_ZONE_Y

  );


  /* =======================================================
     BG 下方控制區

     拉到 Y = 1120 ~ 1280

     這樣圖片本身的灰色區域
     與實際手指操作區完全一致
  ======================================================= */

  ctx.drawImage(

    bg,

    0,
    sourceSplitY,

    sourceWidth,
    sourceHeight -
    sourceSplitY,

    0,
    CONTROL_ZONE_Y,

    GAME_WIDTH,
    CONTROL_ZONE_HEIGHT

  );


  /*
    其他遊戲素材恢復平滑
  */

  ctx.imageSmoothingEnabled =
    true;

}


/* =========================================================
   Score
========================================================= */

function drawScore() {

  ctx.save();


  ctx.textAlign =
    "center";

  ctx.textBaseline =
    "middle";


  ctx.font =
    "bold 28px monospace";


  /*
    Pixel / Arcade 風格陰影
  */

  ctx.fillStyle =
    "rgba(0,0,0,0.75)";


  ctx.fillText(

    `SCORE ${score}`,

    GAME_WIDTH / 2 + 2,

    62

  );


  ctx.fillStyle =
    "#ffffff";


  ctx.fillText(

    `SCORE ${score}`,

    GAME_WIDTH / 2,

    60

  );


  ctx.restore();

}


/* =========================================================
   Draw Bricks
========================================================= */

function drawBricks() {

  ctx.imageSmoothingEnabled =
    true;


  for (
    const brick of bricks
  ) {

    if (
      !brick.active
    ) {
      continue;
    }


    const image =
      assets[
        brick.type
      ];


    ctx.drawImage(

      image,

      brick.x,
      brick.y,

      brick.width,
      brick.height

    );

  }

}


/* =========================================================
   Draw Ball
========================================================= */

function drawBall() {

  ctx.imageSmoothingEnabled =
    true;


  ctx.drawImage(

    assets.ball,

    ball.x,
    ball.y,

    ball.width,
    ball.height

  );

}


/* =========================================================
   Draw Paddle
========================================================= */

function drawPaddle() {

  ctx.imageSmoothingEnabled =
    true;


  ctx.drawImage(

    assets.paddle,

    paddle.x,
    paddle.y,

    paddle.width,
    paddle.height

  );

}


/* =========================================================
   Canvas Coordinate
========================================================= */

function getCanvasPosition(
  event
) {

  const rect =
    canvas.getBoundingClientRect();


  const scaleX =
    GAME_WIDTH /
    rect.width;


  const scaleY =
    GAME_HEIGHT /
    rect.height;


  return {

    x:
      (
        event.clientX -
        rect.left
      )
      *
      scaleX,

    y:
      (
        event.clientY -
        rect.top
      )
      *
      scaleY

  };

}


/* =========================================================
   Paddle Movement
========================================================= */

function movePaddle(
  targetX
) {

  paddle.x =

    targetX -

    paddle.width / 2;


  paddle.x =

    clamp(

      paddle.x,

      0,

      GAME_WIDTH -
      paddle.width

    );

}


/* =========================================================
   Pointer Control
========================================================= */

let controlPointerId = null;


/* =========================================================
   Pointer Down
========================================================= */

canvas.addEventListener(
  "pointerdown",
  event => {

    const position =
      getCanvasPosition(
        event
      );


    /*
      必須從底部控制區開始操作
    */

    if (
      position.y <
      CONTROL_ZONE_Y
    ) {
      return;
    }


    controlPointerId =
      event.pointerId;


    canvas.setPointerCapture(
      event.pointerId
    );


    movePaddle(
      position.x
    );

  }
);


/* =========================================================
   Pointer Move
========================================================= */

canvas.addEventListener(
  "pointermove",
  event => {

    const position =
      getCanvasPosition(
        event
      );


    /*
      手指拖曳
    */

    if (
      controlPointerId ===
      event.pointerId
    ) {

      movePaddle(
        position.x
      );

      return;

    }


    /*
      PC 滑鼠

      滑鼠位於控制區時
      可以直接移動擋板
    */

    if (

      event.pointerType ===
      "mouse" &&

      position.y >=
      CONTROL_ZONE_Y

    ) {

      movePaddle(
        position.x
      );

    }

  }
);


/* =========================================================
   Pointer Up
========================================================= */

canvas.addEventListener(
  "pointerup",
  event => {

    endPointerControl(
      event
    );

  }
);


/* =========================================================
   Pointer Cancel
========================================================= */

canvas.addEventListener(
  "pointercancel",
  event => {

    endPointerControl(
      event
    );

  }
);


/* =========================================================
   End Pointer
========================================================= */

function endPointerControl(
  event
) {

  if (
    controlPointerId !==
    event.pointerId
  ) {
    return;
  }


  if (
    canvas.hasPointerCapture(
      event.pointerId
    )
  ) {

    canvas.releasePointerCapture(
      event.pointerId
    );

  }


  controlPointerId = null;

}


/* =========================================================
   Load Error
========================================================= */

function drawLoadError() {

  ctx.fillStyle =
    "#050914";


  ctx.fillRect(
    0,
    0,
    GAME_WIDTH,
    GAME_HEIGHT
  );


  ctx.fillStyle =
    "#ffffff";


  ctx.font =
    "24px monospace";


  ctx.textAlign =
    "center";


  ctx.fillText(

    "ASSET LOAD ERROR",

    GAME_WIDTH / 2,

    GAME_HEIGHT / 2

  );

}

</script>

</body>
</html>
