<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Breakout Rush</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      touch-action: none;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #gameCanvas {
      display: block;

      width: min(100vw, calc(100vh * 9 / 16));
      height: min(100vh, calc(100vw * 16 / 9));

      background: #050914;

      touch-action: none;
      user-select: none;
      -webkit-user-select: none;

      image-rendering: pixelated;
    }
  </style>
</head>

<body>

<canvas
  id="gameCanvas"
  width="720"
  height="1280"
></canvas>

<script>

/* =========================================================
   Canvas
========================================================= */

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

const GAME_WIDTH = 720;
const GAME_HEIGHT = 1280;


/* =========================================================
   App State
========================================================= */

const STATE_MENU = "menu";
const STATE_GAME = "game";
const STATE_HOW_TO_PLAY = "howToPlay";
const STATE_CREDITS = "credits";
const STATE_GAME_OVER = "gameOver";
const STATE_CLEAR = "clear";

let appState = STATE_MENU;

let canContinue = false;

let lastTime = 0;


/* =========================================================
   Gameplay Layout
========================================================= */

const CONTROL_ZONE_Y = 1120;
const CONTROL_ZONE_HEIGHT = 160;

const BG_SOURCE_SPLIT_RATIO = 0.7895;


/* =========================================================
   Assets
========================================================= */

const assets = {};


function loadImage(name, src) {

  return new Promise((resolve, reject) => {

    const img = new Image();

    img.onload = () => {

      assets[name] = img;

      resolve();

    };

    img.onerror = () => {

      reject(
        new Error(
          `無法載入素材：${src}`
        )
      );

    };

    img.src = src;

  });

}


/* =========================================================
   Load Assets
========================================================= */

Promise.all([

  /* Menu */

  loadImage(
    "menuBg",
    "art/BG/gamemenubg.png"
  ),

  loadImage(
    "menuButton",
    "art/button.png"
  ),


  /* Gameplay */

  loadImage(
    "bg",
    "art/BG/BG.png"
  ),

  loadImage(
    "ball",
    "art/normal_ball.png"
  ),

  loadImage(
    "paddle",
    "art/character.png"
  ),

  loadImage(
    "red",
    "art/red.png"
  ),

  loadImage(
    "yellow",
    "art/yellow.png"
  ),

  loadImage(
    "green",
    "art/green.png"
  ),

  loadImage(
    "blue",
    "art/blue.png"
  ),

  loadImage(
    "purple",
    "art/purple.png"
  )

])

.then(() => {

  initApp();

})

.catch((error) => {

  console.error(error);

  drawLoadError();

});


/* =========================================================
   Game Data
========================================================= */

let score = 0;

const MAX_LIVES = 3;

let lives = MAX_LIVES;


/* =========================================================
   Ball
========================================================= */

const BALL_SPEED = 450;

const ball = {

  width: 32,
  height: 32,

  x:
    GAME_WIDTH / 2 -
    16,

  y: 900,

  vx: 210,
  vy: -398

};


/* =========================================================
   Paddle
========================================================= */

const paddle = {

  width: 160,
  height: 32,

  x:
    GAME_WIDTH / 2 -
    80,

  y: 1060

};


/* =========================================================
   Bricks
========================================================= */

const BRICK_WIDTH = 112;
const BRICK_HEIGHT = 48;

const BRICK_GAP_X = 12;
const BRICK_GAP_Y = 14;

const BRICK_COLUMNS = 5;
const BRICK_ROWS = 4;

const BRICK_START_Y = 170;


const brickTypes = [

  "red",
  "yellow",
  "green",
  "blue",
  "purple"

];


const totalBrickWidth =

  BRICK_COLUMNS *
  BRICK_WIDTH +

  (
    BRICK_COLUMNS -
    1
  ) *

  BRICK_GAP_X;


const BRICK_START_X =

  (
    GAME_WIDTH -
    totalBrickWidth
  ) / 2;


let bricks = [];


/* =========================================================
   Main Menu Layout
========================================================= */

const MENU_BUTTON_X = 145;
const MENU_BUTTON_WIDTH = 430;
const MENU_BUTTON_HEIGHT = 120;

const MENU_BUTTON_START_Y = 390;
const MENU_BUTTON_GAP = 28;

let hoveredMenuButton = -1;


/* =========================================================
   Back Button
========================================================= */

const BACK_BUTTON = {

  x: 190,
  y: 1010,

  width: 340,
  height: 105

};


/* =========================================================
   In Game Menu Button
========================================================= */

const GAME_MENU_BUTTON = {

  x: 570,
  y: 22,

  width: 125,
  height: 52

};


/* =========================================================
   Result Buttons
========================================================= */

const RESULT_RETRY_BUTTON = {

  x: 145,
  y: 700,

  width: 430,
  height: 120

};


const RESULT_MENU_BUTTON = {

  x: 145,
  y: 850,

  width: 430,
  height: 120

};


/* =========================================================
   Init App
========================================================= */

function initApp() {

  createBricks();

  resetBall();

  appState = STATE_MENU;

  lastTime = 0;

  requestAnimationFrame(
    gameLoop
  );

}


/* =========================================================
   Start New Game
========================================================= */

function startNewGame() {

  score = 0;

  lives = MAX_LIVES;

  paddle.x =
    GAME_WIDTH / 2 -
    paddle.width / 2;

  createBricks();

  resetBall();

  controlPointerId = null;

  canContinue = true;

  appState = STATE_GAME;

  lastTime = 0;

}


/* =========================================================
   Continue Game
========================================================= */

function continueGame() {

  if (!canContinue) {
    return;
  }

  controlPointerId = null;

  appState = STATE_GAME;

  lastTime = 0;

}


/* =========================================================
   Return Main Menu
========================================================= */

function returnToMenu() {

  if (
    appState === STATE_GAME
  ) {

    canContinue = true;

  }

  controlPointerId = null;

  hoveredMenuButton = -1;

  appState = STATE_MENU;

  lastTime = 0;

}


/* =========================================================
   Game Over
========================================================= */

function gameOver() {

  lives = 0;

  canContinue = false;

  controlPointerId = null;

  appState = STATE_GAME_OVER;

  lastTime = 0;

}


/* =========================================================
   Stage Clear
========================================================= */

function stageClear() {

  canContinue = false;

  controlPointerId = null;

  appState = STATE_CLEAR;

  lastTime = 0;

}


/* =========================================================
   Create Bricks
========================================================= */

function createBricks() {

  bricks = [];

  for (
    let row = 0;
    row < BRICK_ROWS;
    row++
  ) {

    for (
      let col = 0;
      col < BRICK_COLUMNS;
      col++
    ) {

      bricks.push({

        x:
          BRICK_START_X +
          col *
          (
            BRICK_WIDTH +
            BRICK_GAP_X
          ),

        y:
          BRICK_START_Y +
          row *
          (
            BRICK_HEIGHT +
            BRICK_GAP_Y
          ),

        width:
          BRICK_WIDTH,

        height:
          BRICK_HEIGHT,

        type:
          brickTypes[
            (
              row +
              col
            )
            %
            brickTypes.length
          ],

        active: true

      });

    }

  }

}


/* =========================================================
   Reset Ball
========================================================= */

function resetBall() {

  ball.x =
    GAME_WIDTH / 2 -
    ball.width / 2;

  ball.y = 900;


  const direction =

    Math.random() < 0.5

      ? -1

      : 1;


  ball.vx =
    210 *
    direction;

  ball.vy = -398;

}


/* =========================================================
   Main Loop
========================================================= */

function gameLoop(time) {

  let deltaTime = 0;


  if (
    lastTime !== 0
  ) {

    deltaTime =

      (
        time -
        lastTime
      )

      /

      1000;

  }


  lastTime = time;


  deltaTime =

    Math.min(
      deltaTime,
      1 / 30
    );


  if (
    appState === STATE_GAME
  ) {

    updateGame(
      deltaTime
    );

  }


  draw();


  requestAnimationFrame(
    gameLoop
  );

}


/* =========================================================
   Update Game
========================================================= */

function updateGame(deltaTime) {

  if (
    deltaTime <= 0
  ) {
    return;
  }


  const previousX =
    ball.x;

  const previousY =
    ball.y;


  /* =======================================================
     Ball Movement
  ======================================================= */

  ball.x +=
    ball.vx *
    deltaTime;

  ball.y +=
    ball.vy *
    deltaTime;


  /* =======================================================
     Left Wall
  ======================================================= */

  if (
    ball.x <= 0
  ) {

    ball.x = 0;

    ball.vx =
      Math.abs(
        ball.vx
      );

  }


  /* =======================================================
     Right Wall
  ======================================================= */

  if (

    ball.x +
    ball.width >=
    GAME_WIDTH

  ) {

    ball.x =

      GAME_WIDTH -

      ball.width;


    ball.vx =

      -Math.abs(
        ball.vx
      );

  }


  /* =======================================================
     Top Wall
  ======================================================= */

  if (
    ball.y <= 0
  ) {

    ball.y = 0;

    ball.vy =
      Math.abs(
        ball.vy
      );

  }


  /* =======================================================
     Paddle Collision
  ======================================================= */

  if (

    ball.vy > 0 &&

    rectangleCollision(
      ball,
      paddle
    )

  ) {

    ball.y =

      paddle.y -

      ball.height;


    const ballCenter =

      ball.x +

      ball.width / 2;


    const paddleCenter =

      paddle.x +

      paddle.width / 2;


    let hitPosition =

      (
        ballCenter -
        paddleCenter
      )

      /

      (
        paddle.width / 2
      );


    hitPosition =

      clamp(
        hitPosition,
        -1,
        1
      );


    const maxAngle =

      Math.PI *
      0.36;


    const angle =

      hitPosition *
      maxAngle;


    ball.vx =

      Math.sin(
        angle
      )

      *

      BALL_SPEED;


    ball.vy =

      -Math.cos(
        angle
      )

      *

      BALL_SPEED;


    /*
      避免球完全垂直
    */

    if (

      Math.abs(
        ball.vx
      ) < 45

    ) {

      let direction;


      if (
        hitPosition < 0
      ) {

        direction = -1;

      } else if (
        hitPosition > 0
      ) {

        direction = 1;

      } else {

        direction =
          Math.random() < 0.5
            ? -1
            : 1;

      }


      ball.vx =
        45 *
        direction;

    }

  }


  /* =======================================================
     Brick Collision
  ======================================================= */

  for (
    const brick of bricks
  ) {

    if (
      !brick.active
    ) {

      continue;

    }


    if (

      !rectangleCollision(
        ball,
        brick
      )

    ) {

      continue;

    }


    brick.active = false;

    score += 100;


    resolveBrickCollision(

      brick,

      previousX,

      previousY

    );


    break;

  }


  /* =======================================================
     Ball Lost
  ======================================================= */

  if (

    ball.y +
    ball.height >=
    CONTROL_ZONE_Y

  ) {

    handleBallLost();

    return;

  }


  /* =======================================================
     Stage Clear
  ======================================================= */

  const remainingBricks =

    bricks.some(

      brick =>
        brick.active

    );


  if (
    !remainingBricks
  ) {

    stageClear();

  }

}


/* =========================================================
   Ball Lost
========================================================= */

function handleBallLost() {

  lives -= 1;


  if (
    lives <= 0
  ) {

    gameOver();

    return;

  }


  /*
    還有生命
    重新把球放回場上
  */

  paddle.x =
    GAME_WIDTH / 2 -
    paddle.width / 2;


  resetBall();

}


/* =========================================================
   Brick Collision Resolve
========================================================= */

function resolveBrickCollision(
  brick,
  previousX,
  previousY
) {

  const previousLeft =
    previousX;

  const previousRight =
    previousX +
    ball.width;

  const previousTop =
    previousY;

  const previousBottom =
    previousY +
    ball.height;


  const brickLeft =
    brick.x;

  const brickRight =
    brick.x +
    brick.width;

  const brickTop =
    brick.y;

  const brickBottom =
    brick.y +
    brick.height;


  /* =======================================================
     Hit From Top
  ======================================================= */

  if (
    previousBottom <=
    brickTop
  ) {

    ball.y =

      brickTop -

      ball.height;


    ball.vy =

      -Math.abs(
        ball.vy
      );

    return;

  }


  /* =======================================================
     Hit From Bottom
  ======================================================= */

  if (
    previousTop >=
    brickBottom
  ) {

    ball.y =
      brickBottom;


    ball.vy =

      Math.abs(
        ball.vy
      );

    return;

  }


  /* =======================================================
     Hit From Left
  ======================================================= */

  if (
    previousRight <=
    brickLeft
  ) {

    ball.x =

      brickLeft -

      ball.width;


    ball.vx =

      -Math.abs(
        ball.vx
      );

    return;

  }


  /* =======================================================
     Hit From Right
  ======================================================= */

  if (
    previousLeft >=
    brickRight
  ) {

    ball.x =
      brickRight;


    ball.vx =

      Math.abs(
        ball.vx
      );

    return;

  }


  /*
    Fallback
  */

  ball.vy *= -1;

}


/* =========================================================
   Rectangle Collision
========================================================= */

function rectangleCollision(
  a,
  b
) {

  return (

    a.x <
    b.x +
    b.width &&

    a.x +
    a.width >
    b.x &&

    a.y <
    b.y +
    b.height &&

    a.y +
    a.height >
    b.y

  );

}


/* =========================================================
   Point In Rectangle
========================================================= */

function pointInRect(
  x,
  y,
  rect
) {

  return (

    x >= rect.x &&

    x <=
    rect.x +
    rect.width &&

    y >= rect.y &&

    y <=
    rect.y +
    rect.height

  );

}


/* =========================================================
   Clamp
========================================================= */

function clamp(
  value,
  min,
  max
) {

  return Math.max(

    min,

    Math.min(
      max,
      value
    )

  );

}


/* =========================================================
   Draw
========================================================= */

function draw() {

  ctx.clearRect(
    0,
    0,
    GAME_WIDTH,
    GAME_HEIGHT
  );


  switch (
    appState
  ) {

    case STATE_MENU:

      drawMainMenu();

      break;


    case STATE_GAME:

      drawGame();

      break;


    case STATE_HOW_TO_PLAY:

      drawHowToPlay();

      break;


    case STATE_CREDITS:

      drawCredits();

      break;


    case STATE_GAME_OVER:

      drawGameOver();

      break;


    case STATE_CLEAR:

      drawStageClear();

      break;

  }

}


/* =========================================================
   Menu Background
========================================================= */

function drawMenuBackground() {

  ctx.imageSmoothingEnabled =
    false;


  ctx.drawImage(

    assets.menuBg,

    0,
    0,

    GAME_WIDTH,
    GAME_HEIGHT

  );

}


/* =========================================================
   Main Menu
========================================================= */

function drawMainMenu() {

  drawMenuBackground();

  drawMainTitle();


  const buttons =
    getMenuButtons();


  for (
    let i = 0;
    i < buttons.length;
    i++
  ) {

    drawMenuButton(
      buttons[i],
      i
    );

  }

}


/* =========================================================
   Main Title
========================================================= */

function drawMainTitle() {

  ctx.save();


  ctx.textAlign =
    "center";

  ctx.textBaseline =
    "middle";


  ctx.font =
    "bold 48px monospace";


  ctx.lineWidth = 8;

  ctx.strokeStyle =
    "#14120d";


  ctx.strokeText(

    "BREAKOUT",

    GAME_WIDTH / 2,

    150

  );


  ctx.fillStyle =
    "#d99432";


  ctx.fillText(

    "BREAKOUT",

    GAME_WIDTH / 2,

    150

  );


  ctx.font =
    "bold 52px monospace";


  ctx.strokeText(

    "RUSH",

    GAME_WIDTH / 2,

    205

  );


  ctx.fillStyle =
    "#f2b545";


  ctx.fillText(

    "RUSH",

    GAME_WIDTH / 2,

    205

  );


  ctx.restore();

}


/* =========================================================
   Menu Buttons
========================================================= */

function getMenuButtons() {

  return [

    {
      label: "PLAY",
      action: "play",
      enabled: true
    },

    {
      label: "CONTINUE",
      action: "continue",
      enabled: canContinue
    },

    {
      label: "HOW TO PLAY",
      action: "howToPlay",
      enabled: true
    },

    {
      label: "CREDITS",
      action: "credits",
      enabled: true
    }

  ].map(
    (button, index) => {

      return {

        ...button,

        x:
          MENU_BUTTON_X,

        y:
          MENU_BUTTON_START_Y +

          index *

          (
            MENU_BUTTON_HEIGHT +
            MENU_BUTTON_GAP
          ),

        width:
          MENU_BUTTON_WIDTH,

        height:
          MENU_BUTTON_HEIGHT

      };

    }
  );

}


/* =========================================================
   Draw Menu Button
========================================================= */

function drawMenuButton(
  button,
  index
) {

  const hover =

    index ===
    hoveredMenuButton;


  const offsetY =

    hover &&
    button.enabled

      ? 4

      : 0;


  drawButton(

    button.x,

    button.y +
    offsetY,

    button.width,

    button.height,

    button.label,

    button.enabled

  );

}


/* =========================================================
   Generic Pixel Button
========================================================= */

function drawButton(
  x,
  y,
  width,
  height,
  label,
  enabled = true
) {

  ctx.save();


  if (
    !enabled
  ) {

    ctx.globalAlpha =
      0.48;

  }


  ctx.imageSmoothingEnabled =
    false;


  ctx.drawImage(

    assets.menuButton,

    x,
    y,

    width,
    height

  );


  ctx.globalAlpha =
    enabled
      ? 1
      : 0.42;


  ctx.textAlign =
    "center";

  ctx.textBaseline =
    "middle";


  let fontSize = 39;


  if (
    label.length >= 10
  ) {

    fontSize = 31;

  }


  ctx.font =

    `bold ${fontSize}px monospace`;


  ctx.lineWidth = 7;

  ctx.strokeStyle =
    "#17130e";


  ctx.strokeText(

    label,

    x +
    width / 2,

    y +
    height / 2

  );


  ctx.fillStyle =

    enabled

      ? "#d99432"

      : "#928b78";


  ctx.fillText(

    label,

    x +
    width / 2,

    y +
    height / 2

  );


  ctx.restore();

}


/* =========================================================
   How To Play
========================================================= */

function drawHowToPlay() {

  drawMenuBackground();


  drawPageTitle(
    "HOW TO PLAY"
  );


  ctx.save();


  ctx.textAlign =
    "center";

  ctx.textBaseline =
    "middle";


  ctx.fillStyle =
    "#322e24";


  ctx.font =
    "bold 29px monospace";


  ctx.fillText(
    "DRAG YOUR FINGER",
    GAME_WIDTH / 2,
    420
  );


  ctx.fillText(
    "IN THE BOTTOM AREA",
    GAME_WIDTH / 2,
    475
  );


  ctx.fillText(
    "MOVE THE PADDLE",
    GAME_WIDTH / 2,
    580
  );


  ctx.fillText(
    "BREAK ALL BRICKS",
    GAME_WIDTH / 2,
    680
  );


  ctx.fillText(
    "YOU HAVE 3 LIVES",
    GAME_WIDTH / 2,
    780
  );


  ctx.fillText(
    "DON'T MISS THE BALL",
    GAME_WIDTH / 2,
    835
  );


  ctx.restore();


  drawBackButton();

}


/* =========================================================
   Credits
========================================================= */

function drawCredits() {

  drawMenuBackground();


  drawPageTitle(
    "CREDITS"
  );


  ctx.save();


  ctx.textAlign =
    "center";

  ctx.textBaseline =
    "middle";


  ctx.fillStyle =
    "#322e24";


  ctx.font =
    "bold 32px monospace";


  ctx.fillText(

    "BREAKOUT RUSH",

    GAME_WIDTH / 2,

    480

  );


  ctx.font =
    "bold 25px monospace";


  ctx.fillText(

    "GAME PROTOTYPE",

    GAME_WIDTH / 2,

    550

  );


  ctx.fillText(

    "2026",

    GAME_WIDTH / 2,

    610

  );


  ctx.restore();


  drawBackButton();

}


/* =========================================================
   Page Title
========================================================= */

function drawPageTitle(
  text
) {

  ctx.save();


  ctx.textAlign =
    "center";

  ctx.textBaseline =
    "middle";


  ctx.font =
    "bold 43px monospace";


  ctx.lineWidth = 8;

  ctx.strokeStyle =
    "#17130e";


  ctx.strokeText(

    text,

    GAME_WIDTH / 2,

    175

  );


  ctx.fillStyle =
    "#db9735";


  ctx.fillText(

    text,

    GAME_WIDTH / 2,

    175

  );


  ctx.restore();

}


/* =========================================================
   Back Button
========================================================= */

function drawBackButton() {

  drawButton(

    BACK_BUTTON.x,
    BACK_BUTTON.y,

    BACK_BUTTON.width,
    BACK_BUTTON.height,

    "BACK"

  );

}


/* =========================================================
   Draw Gameplay
========================================================= */

function drawGame() {

  drawGameBackground();

  drawBricks();

  drawBall();

  drawPaddle();

  drawHUD();

  drawGameMenuButton();

}


/* =========================================================
   Gameplay Background
========================================================= */

function drawGameBackground() {

  const bg =
    assets.bg;


  ctx.imageSmoothingEnabled =
    false;


  const sourceWidth =
    bg.naturalWidth;

  const sourceHeight =
    bg.naturalHeight;


  const sourceSplitY =

    Math.floor(

      sourceHeight *
      BG_SOURCE_SPLIT_RATIO

    );


  /* Gameplay */

  ctx.drawImage(

    bg,

    0,
    0,

    sourceWidth,
    sourceSplitY,

    0,
    0,

    GAME_WIDTH,
    CONTROL_ZONE_Y

  );


  /* Control Zone */

  ctx.drawImage(

    bg,

    0,
    sourceSplitY,

    sourceWidth,

    sourceHeight -
    sourceSplitY,

    0,
    CONTROL_ZONE_Y,

    GAME_WIDTH,
    CONTROL_ZONE_HEIGHT

  );

}


/* =========================================================
   HUD
========================================================= */

function drawHUD() {

  ctx.save();


  ctx.textBaseline =
    "middle";

  ctx.font =
    "bold 25px monospace";


  /* Score */

  ctx.textAlign =
    "left";


  drawHUDText(

    `SCORE ${score}`,

    28,

    48

  );


  /* Lives */

  ctx.textAlign =
    "center";


  drawHUDText(

    `LIFE ${lives}`,

    GAME_WIDTH / 2,

    48

  );


  ctx.restore();

}


/* =========================================================
   HUD Text
========================================================= */

function drawHUDText(
  text,
  x,
  y
) {

  ctx.fillStyle =
    "rgba(0,0,0,0.85)";


  ctx.fillText(

    text,

    x + 2,

    y + 2

  );


  ctx.fillStyle =
    "#ffffff";


  ctx.fillText(

    text,

    x,

    y

  );

}


/* =========================================================
   Game Menu Button
========================================================= */

function drawGameMenuButton() {

  ctx.save();


  ctx.imageSmoothingEnabled =
    false;


  ctx.drawImage(

    assets.menuButton,

    GAME_MENU_BUTTON.x,
    GAME_MENU_BUTTON.y,

    GAME_MENU_BUTTON.width,
    GAME_MENU_BUTTON.height

  );


  ctx.textAlign =
    "center";

  ctx.textBaseline =
    "middle";


  ctx.font =
    "bold 19px monospace";


  ctx.lineWidth = 4;

  ctx.strokeStyle =
    "#17130e";


  ctx.strokeText(

    "MENU",

    GAME_MENU_BUTTON.x +
    GAME_MENU_BUTTON.width / 2,

    GAME_MENU_BUTTON.y +
    GAME_MENU_BUTTON.height / 2

  );


  ctx.fillStyle =
    "#d99432";


  ctx.fillText(

    "MENU",

    GAME_MENU_BUTTON.x +
    GAME_MENU_BUTTON.width / 2,

    GAME_MENU_BUTTON.y +
    GAME_MENU_BUTTON.height / 2

  );


  ctx.restore();

}


/* =========================================================
   Game Over
========================================================= */

function drawGameOver() {

  drawMenuBackground();


  drawResultTitle(
    "GAME OVER",
    "#c74d36"
  );


  drawResultScore();


  drawButton(

    RESULT_RETRY_BUTTON.x,
    RESULT_RETRY_BUTTON.y,

    RESULT_RETRY_BUTTON.width,
    RESULT_RETRY_BUTTON.height,

    "RETRY"

  );


  drawButton(

    RESULT_MENU_BUTTON.x,
    RESULT_MENU_BUTTON.y,

    RESULT_MENU_BUTTON.width,
    RESULT_MENU_BUTTON.height,

    "MENU"

  );

}


/* =========================================================
   Stage Clear
========================================================= */

function drawStageClear() {

  drawMenuBackground();


  drawResultTitle(
    "STAGE CLEAR",
    "#d99432"
  );


  drawResultScore();


  drawButton(

    RESULT_RETRY_BUTTON.x,
    RESULT_RETRY_BUTTON.y,

    RESULT_RETRY_BUTTON.width,
    RESULT_RETRY_BUTTON.height,

    "RETRY"

  );


  drawButton(

    RESULT_MENU_BUTTON.x,
    RESULT_MENU_BUTTON.y,

    RESULT_MENU_BUTTON.width,
    RESULT_MENU_BUTTON.height,

    "MENU"

  );

}


/* =========================================================
   Result Title
========================================================= */

function drawResultTitle(
  text,
  color
) {

  ctx.save();


  ctx.textAlign =
    "center";

  ctx.textBaseline =
    "middle";


  ctx.font =
    "bold 50px monospace";


  ctx.lineWidth = 9;

  ctx.strokeStyle =
    "#17130e";


  ctx.strokeText(

    text,

    GAME_WIDTH / 2,

    280

  );


  ctx.fillStyle =
    color;


  ctx.fillText(

    text,

    GAME_WIDTH / 2,

    280

  );


  ctx.restore();

}


/* =========================================================
   Result Score
========================================================= */

function drawResultScore() {

  ctx.save();


  ctx.textAlign =
    "center";

  ctx.textBaseline =
    "middle";


  ctx.font =
    "bold 34px monospace";


  ctx.lineWidth = 6;

  ctx.strokeStyle =
    "#17130e";


  ctx.strokeText(

    `SCORE ${score}`,

    GAME_WIDTH / 2,

    470

  );


  ctx.fillStyle =
    "#d99432";


  ctx.fillText(

    `SCORE ${score}`,

    GAME_WIDTH / 2,

    470

  );


  ctx.restore();

}


/* =========================================================
   Draw Bricks
========================================================= */

function drawBricks() {

  ctx.imageSmoothingEnabled =
    true;


  for (
    const brick of bricks
  ) {

    if (
      !brick.active
    ) {

      continue;

    }


    ctx.drawImage(

      assets[
        brick.type
      ],

      brick.x,
      brick.y,

      brick.width,
      brick.height

    );

  }

}


/* =========================================================
   Draw Ball
========================================================= */

function drawBall() {

  ctx.imageSmoothingEnabled =
    true;


  ctx.drawImage(

    assets.ball,

    ball.x,
    ball.y,

    ball.width,
    ball.height

  );

}


/* =========================================================
   Draw Paddle
========================================================= */

function drawPaddle() {

  ctx.imageSmoothingEnabled =
    true;


  ctx.drawImage(

    assets.paddle,

    paddle.x,
    paddle.y,

    paddle.width,
    paddle.height

  );

}


/* =========================================================
   Canvas Coordinate
========================================================= */

function getCanvasPosition(
  event
) {

  const rect =
    canvas.getBoundingClientRect();


  const scaleX =

    GAME_WIDTH /
    rect.width;


  const scaleY =

    GAME_HEIGHT /
    rect.height;


  return {

    x:

      (
        event.clientX -
        rect.left
      )

      *

      scaleX,


    y:

      (
        event.clientY -
        rect.top
      )

      *

      scaleY

  };

}


/* =========================================================
   Paddle Movement
========================================================= */

function movePaddle(
  targetX
) {

  paddle.x =

    targetX -

    paddle.width / 2;


  paddle.x =

    clamp(

      paddle.x,

      0,

      GAME_WIDTH -
      paddle.width

    );

}


/* =========================================================
   Menu Click
========================================================= */

function handleMenuClick(
  x,
  y
) {

  const buttons =
    getMenuButtons();


  for (
    const button of buttons
  ) {

    if (

      !pointInRect(
        x,
        y,
        button
      )

    ) {

      continue;

    }


    if (
      !button.enabled
    ) {

      return;

    }


    switch (
      button.action
    ) {

      case "play":

        startNewGame();

        return;


      case "continue":

        continueGame();

        return;


      case "howToPlay":

        appState =
          STATE_HOW_TO_PLAY;

        hoveredMenuButton =
          -1;

        return;


      case "credits":

        appState =
          STATE_CREDITS;

        hoveredMenuButton =
          -1;

        return;

    }

  }

}


/* =========================================================
   Result Click
========================================================= */

function handleResultClick(
  x,
  y
) {

  if (

    pointInRect(
      x,
      y,
      RESULT_RETRY_BUTTON
    )

  ) {

    startNewGame();

    return;

  }


  if (

    pointInRect(
      x,
      y,
      RESULT_MENU_BUTTON
    )

  ) {

    canContinue = false;

    returnToMenu();

  }

}


/* =========================================================
   Menu Hover
========================================================= */

function updateMenuHover(
  x,
  y
) {

  hoveredMenuButton =
    -1;


  const buttons =
    getMenuButtons();


  for (
    let i = 0;
    i < buttons.length;
    i++
  ) {

    if (

      buttons[i].enabled &&

      pointInRect(
        x,
        y,
        buttons[i]
      )

    ) {

      hoveredMenuButton =
        i;

      return;

    }

  }

}


/* =========================================================
   Pointer Control
========================================================= */

let controlPointerId = null;


/* =========================================================
   Pointer Down
========================================================= */

canvas.addEventListener(
  "pointerdown",
  event => {

    const position =

      getCanvasPosition(
        event
      );


    /* =====================================================
       Main Menu
    ===================================================== */

    if (
      appState === STATE_MENU
    ) {

      handleMenuClick(
        position.x,
        position.y
      );

      return;

    }


    /* =====================================================
       How To Play / Credits
    ===================================================== */

    if (

      appState ===
      STATE_HOW_TO_PLAY ||

      appState ===
      STATE_CREDITS

    ) {

      if (

        pointInRect(
          position.x,
          position.y,
          BACK_BUTTON
        )

      ) {

        returnToMenu();

      }

      return;

    }


    /* =====================================================
       Result Screen
    ===================================================== */

    if (

      appState ===
      STATE_GAME_OVER ||

      appState ===
      STATE_CLEAR

    ) {

      handleResultClick(
        position.x,
        position.y
      );

      return;

    }


    /* =====================================================
       Gameplay
    ===================================================== */

    if (
      appState !== STATE_GAME
    ) {

      return;

    }


    /*
      Game Menu
    */

    if (

      pointInRect(
        position.x,
        position.y,
        GAME_MENU_BUTTON
      )

    ) {

      returnToMenu();

      return;

    }


    /*
      手指必須從控制區開始
    */

    if (

      position.y <
      CONTROL_ZONE_Y

    ) {

      return;

    }


    controlPointerId =
      event.pointerId;


    canvas.setPointerCapture(
      event.pointerId
    );


    movePaddle(
      position.x
    );

  }
);


/* =========================================================
   Pointer Move
========================================================= */

canvas.addEventListener(
  "pointermove",
  event => {

    const position =

      getCanvasPosition(
        event
      );


    /* =====================================================
       Menu Hover
    ===================================================== */

    if (
      appState === STATE_MENU
    ) {

      if (
        event.pointerType ===
        "mouse"
      ) {

        updateMenuHover(
          position.x,
          position.y
        );

      }

      return;

    }


    /* =====================================================
       Gameplay
    ===================================================== */

    if (
      appState !== STATE_GAME
    ) {

      return;

    }


    /*
      Touch drag
    */

    if (

      controlPointerId ===
      event.pointerId

    ) {

      movePaddle(
        position.x
      );

      return;

    }


    /*
      PC Mouse
    */

    if (

      event.pointerType ===
      "mouse" &&

      position.y >=
      CONTROL_ZONE_Y

    ) {

      movePaddle(
        position.x
      );

    }

  }
);


/* =========================================================
   Pointer Up
========================================================= */

canvas.addEventListener(
  "pointerup",
  event => {

    endPointerControl(
      event
    );

  }
);


/* =========================================================
   Pointer Cancel
========================================================= */

canvas.addEventListener(
  "pointercancel",
  event => {

    endPointerControl(
      event
    );

  }
);


/* =========================================================
   Pointer Leave
========================================================= */

canvas.addEventListener(
  "pointerleave",
  () => {

    if (
      appState === STATE_MENU
    ) {

      hoveredMenuButton =
        -1;

    }

  }
);


/* =========================================================
   End Pointer
========================================================= */

function endPointerControl(
  event
) {

  if (

    controlPointerId !==
    event.pointerId

  ) {

    return;

  }


  if (

    canvas.hasPointerCapture(
      event.pointerId
    )

  ) {

    canvas.releasePointerCapture(
      event.pointerId
    );

  }


  controlPointerId = null;

}


/* =========================================================
   Keyboard
========================================================= */

window.addEventListener(
  "keydown",
  event => {

    if (
      event.key !==
      "Escape"
    ) {

      return;

    }


    if (
      appState === STATE_GAME
    ) {

      returnToMenu();

      return;

    }


    if (

      appState ===
      STATE_HOW_TO_PLAY ||

      appState ===
      STATE_CREDITS

    ) {

      returnToMenu();

      return;

    }


    if (

      appState ===
      STATE_GAME_OVER ||

      appState ===
      STATE_CLEAR

    ) {

      canContinue = false;

      returnToMenu();

    }

  }
);


/* =========================================================
   Load Error
========================================================= */

function drawLoadError() {

  ctx.fillStyle =
    "#050914";


  ctx.fillRect(
    0,
    0,
    GAME_WIDTH,
    GAME_HEIGHT
  );


  ctx.fillStyle =
    "#ffffff";


  ctx.font =
    "24px monospace";


  ctx.textAlign =
    "center";


  ctx.fillText(

    "ASSET LOAD ERROR",

    GAME_WIDTH / 2,

    GAME_HEIGHT / 2

  );

}

</script>
