<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Breakout Rush</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #222;
      touch-action: none;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #gameCanvas {
      display: block;

      width: min(100vw, calc(100vh * 9 / 16));
      height: min(100vh, calc(100vw * 16 / 9));

      background: #111827;

      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
  </style>
</head>

<body>

<canvas
  id="gameCanvas"
  width="720"
  height="1280"
></canvas>

<script>

/* =========================================================
   Canvas
========================================================= */

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

const GAME_WIDTH = 720;
const GAME_HEIGHT = 1280;


/* =========================================================
   Layout
========================================================= */

/*
  0 ~ 1119
  遊戲區

  1120 ~ 1279
  手指操作區
*/

const CONTROL_ZONE_Y = 1120;
const CONTROL_ZONE_HEIGHT = 160;


/* =========================================================
   Assets
========================================================= */

const assets = {};


function loadImage(name, src) {

  return new Promise((resolve, reject) => {

    const img = new Image();

    img.onload = () => {

      assets[name] = img;

      resolve();

    };

    img.onerror = reject;

    img.src = src;

  });

}


/* =========================================================
   Load Assets
========================================================= */

Promise.all([

  loadImage(
    "ball",
    "art/normal_ball.png"
  ),

  loadImage(
    "paddle",
    "art/character.png"
  ),

  loadImage(
    "red",
    "art/red.png"
  ),

  loadImage(
    "yellow",
    "art/yellow.png"
  ),

  loadImage(
    "green",
    "art/green.png"
  ),

  loadImage(
    "blue",
    "art/blue.png"
  ),

  loadImage(
    "purple",
    "art/purple.png"
  )

])

.then(() => {

  initGame();

})

.catch((error) => {

  console.error(
    "素材載入失敗：",
    error
  );

});


/* =========================================================
   Game State
========================================================= */

let running = false;

let score = 0;


/* =========================================================
   Ball
========================================================= */

const ball = {

  width: 32,
  height: 32,

  x:
    GAME_WIDTH / 2 -
    16,

  y: 900,

  vx: 4,
  vy: -7

};


/* =========================================================
   Paddle
========================================================= */

const paddle = {

  width: 160,
  height: 32,

  x:
    GAME_WIDTH / 2 -
    80,

  /*
    擋板位於操作區上方
  */

  y: 1060

};


/* =========================================================
   Bricks
========================================================= */

const BRICK_WIDTH = 112;
const BRICK_HEIGHT = 48;

const BRICK_GAP_X = 12;
const BRICK_GAP_Y = 14;

const BRICK_COLUMNS = 5;
const BRICK_ROWS = 4;

const BRICK_START_Y = 170;


/*
  計算整排磚塊寬度
*/

const totalBrickWidth =

  BRICK_COLUMNS *
  BRICK_WIDTH +

  (
    BRICK_COLUMNS -
    1
  ) *

  BRICK_GAP_X;


/*
  水平置中
*/

const BRICK_START_X =

  (
    GAME_WIDTH -
    totalBrickWidth
  ) / 2;


/* =========================================================
   Brick Types
========================================================= */

const brickTypes = [

  "red",
  "yellow",
  "green",
  "blue",
  "purple"

];


let bricks = [];


/* =========================================================
   Create Bricks
========================================================= */

function createBricks() {

  bricks = [];


  for (
    let row = 0;
    row < BRICK_ROWS;
    row++
  ) {

    for (
      let col = 0;
      col < BRICK_COLUMNS;
      col++
    ) {

      bricks.push({

        x:
          BRICK_START_X +

          col *

          (
            BRICK_WIDTH +
            BRICK_GAP_X
          ),


        y:
          BRICK_START_Y +

          row *

          (
            BRICK_HEIGHT +
            BRICK_GAP_Y
          ),


        width:
          BRICK_WIDTH,


        height:
          BRICK_HEIGHT,


        type:

          brickTypes[

            (
              row +
              col
            )

            %

            brickTypes.length

          ],


        active: true

      });

    }

  }

}


/* =========================================================
   Init Game
========================================================= */

function initGame() {

  score = 0;

  createBricks();

  resetBall();


  paddle.x =

    GAME_WIDTH / 2 -

    paddle.width / 2;


  running = true;

  requestAnimationFrame(
    gameLoop
  );

}


/* =========================================================
   Reset Ball
========================================================= */

function resetBall() {

  ball.x =

    GAME_WIDTH / 2 -

    ball.width / 2;


  ball.y = 900;


  ball.vx =

    Math.random() > 0.5

      ? 4

      : -4;


  ball.vy = -7;

}


/* =========================================================
   Main Loop
========================================================= */

function gameLoop() {

  if (!running) {

    return;

  }


  update();

  draw();


  requestAnimationFrame(
    gameLoop
  );

}


/* =========================================================
   Update
========================================================= */

function update() {

  /* ==============================
     Move Ball
  ============================== */

  ball.x += ball.vx;

  ball.y += ball.vy;


  /* ==============================
     Left Wall
  ============================== */

  if (
    ball.x <= 0
  ) {

    ball.x = 0;

    ball.vx =
      Math.abs(
        ball.vx
      );

  }


  /* ==============================
     Right Wall
  ============================== */

  if (

    ball.x +
    ball.width >=
    GAME_WIDTH

  ) {

    ball.x =

      GAME_WIDTH -

      ball.width;


    ball.vx =

      -Math.abs(
        ball.vx
      );

  }


  /* ==============================
     Top Wall
  ============================== */

  if (
    ball.y <= 0
  ) {

    ball.y = 0;

    ball.vy =
      Math.abs(
        ball.vy
      );

  }


  /* ==============================
     Paddle Collision
  ============================== */

  if (

    ball.vy > 0 &&

    ball.x +
    ball.width >
    paddle.x &&

    ball.x <
    paddle.x +
    paddle.width &&

    ball.y +
    ball.height >
    paddle.y &&

    ball.y <
    paddle.y +
    paddle.height

  ) {

    /*
      防止球卡進擋板
    */

    ball.y =

      paddle.y -

      ball.height;


    /*
      往上反彈
    */

    ball.vy =

      -Math.abs(
        ball.vy
      );


    /*
      球撞到擋板不同位置
      會改變左右方向
    */

    const ballCenter =

      ball.x +

      ball.width / 2;


    const paddleCenter =

      paddle.x +

      paddle.width / 2;


    const hitPosition =

      (
        ballCenter -
        paddleCenter
      )

      /

      (
        paddle.width / 2
      );


    /*
      最大水平速度約 7
    */

    ball.vx =
      hitPosition * 7;


    /*
      避免太垂直
    */

    if (
      Math.abs(ball.vx) < 1.5
    ) {

      ball.vx =

        ball.vx < 0

          ? -1.5

          : 1.5;

    }

  }


  /* ==============================
     Brick Collision
  ============================== */

  for (
    const brick of bricks
  ) {

    if (
      !brick.active
    ) {

      continue;

    }


    if (

      ball.x +
      ball.width >
      brick.x &&

      ball.x <
      brick.x +
      brick.width &&

      ball.y +
      ball.height >
      brick.y &&

      ball.y <
      brick.y +
      brick.height

    ) {

      brick.active = false;

      score += 100;


      /*
        第一版先採用簡單反彈
      */

      ball.vy *= -1;


      break;

    }

  }


  /* ==============================
     Ball Lost
  ============================== */

  /*
    球進入手指操作區
    視為掉球
  */

  if (

    ball.y +
    ball.height >=
    CONTROL_ZONE_Y

  ) {

    resetBall();

  }


  /* ==============================
     Stage Clear
  ============================== */

  const remainingBricks =

    bricks.filter(

      brick =>
        brick.active

    );


  if (
    remainingBricks.length === 0
  ) {

    createBricks();

    resetBall();

  }

}


/* =========================================================
   Draw
========================================================= */

function draw() {

  ctx.clearRect(
    0,
    0,
    GAME_WIDTH,
    GAME_HEIGHT
  );


  drawBackground();

  drawScore();

  drawBricks();

  drawBall();

  drawPaddle();

  drawControlZone();

}


/* =========================================================
   Background
========================================================= */

function drawBackground() {

  /*
    遊戲區背景
  */

  const gradient =

    ctx.createLinearGradient(
      0,
      0,
      0,
      CONTROL_ZONE_Y
    );


  gradient.addColorStop(
    0,
    "#182848"
  );


  gradient.addColorStop(
    0.5,
    "#203a64"
  );


  gradient.addColorStop(
    1,
    "#101827"
  );


  ctx.fillStyle =
    gradient;


  ctx.fillRect(
    0,
    0,
    GAME_WIDTH,
    CONTROL_ZONE_Y
  );

}


/* =========================================================
   Control Zone
========================================================= */

function drawControlZone() {

  /*
    下方手指左右滑動區
  */

  ctx.fillStyle =
    "#555555";


  ctx.fillRect(
    0,
    CONTROL_ZONE_Y,
    GAME_WIDTH,
    CONTROL_ZONE_HEIGHT
  );


  /*
    操作區上方分隔線
  */

  ctx.fillStyle =
    "rgba(255,255,255,0.15)";


  ctx.fillRect(
    0,
    CONTROL_ZONE_Y,
    GAME_WIDTH,
    2
  );

}


/* =========================================================
   Score
========================================================= */

function drawScore() {

  ctx.fillStyle =
    "rgba(255,255,255,0.9)";


  ctx.font =
    "bold 28px Arial";


  ctx.textAlign =
    "center";


  ctx.textBaseline =
    "middle";


  ctx.fillText(
    `SCORE ${score}`,
    GAME_WIDTH / 2,
    60
  );

}


/* =========================================================
   Draw Bricks
========================================================= */

function drawBricks() {

  for (
    const brick of bricks
  ) {

    if (
      !brick.active
    ) {

      continue;

    }


    const img =
      assets[
        brick.type
      ];


    ctx.drawImage(
      img,

      brick.x,
      brick.y,

      brick.width,
      brick.height
    );

  }

}


/* =========================================================
   Draw Ball
========================================================= */

function drawBall() {

  ctx.drawImage(
    assets.ball,

    ball.x,
    ball.y,

    ball.width,
    ball.height
  );

}


/* =========================================================
   Draw Paddle
========================================================= */

function drawPaddle() {

  ctx.drawImage(
    assets.paddle,

    paddle.x,
    paddle.y,

    paddle.width,
    paddle.height
  );

}


/* =========================================================
   Canvas Position
========================================================= */

function getCanvasPosition(
  event
) {

  const rect =

    canvas.getBoundingClientRect();


  const scaleX =

    GAME_WIDTH /

    rect.width;


  const scaleY =

    GAME_HEIGHT /

    rect.height;


  return {

    x:

      (
        event.clientX -
        rect.left
      )

      *

      scaleX,


    y:

      (
        event.clientY -
        rect.top
      )

      *

      scaleY

  };

}


/* =========================================================
   Paddle Movement
========================================================= */

function movePaddle(
  targetX
) {

  paddle.x =

    targetX -

    paddle.width / 2;


  /*
    左側限制
  */

  if (
    paddle.x < 0
  ) {

    paddle.x = 0;

  }


  /*
    右側限制
  */

  if (

    paddle.x +
    paddle.width >
    GAME_WIDTH

  ) {

    paddle.x =

      GAME_WIDTH -

      paddle.width;

  }

}


/* =========================================================
   Pointer Input
========================================================= */

let controlPointerId = null;


/* ==============================
   Pointer Down
============================== */

canvas.addEventListener(
  "pointerdown",
  (event) => {

    const pos =

      getCanvasPosition(
        event
      );


    /*
      只有點擊灰色操作區
      才能開始控制
    */

    if (
      pos.y >=
      CONTROL_ZONE_Y
    ) {

      controlPointerId =
        event.pointerId;


      canvas.setPointerCapture(
        event.pointerId
      );


      movePaddle(
        pos.x
      );

    }

  }
);


/* ==============================
   Pointer Move
============================== */

canvas.addEventListener(
  "pointermove",
  (event) => {

    const pos =

      getCanvasPosition(
        event
      );


    /*
      手機 / 按住滑鼠
    */

    if (
      controlPointerId ===
      event.pointerId
    ) {

      movePaddle(
        pos.x
      );

      return;

    }


    /*
      電腦滑鼠：
      游標位於灰色區域時
      可直接左右移動
    */

    if (

      event.pointerType ===
      "mouse" &&

      pos.y >=
      CONTROL_ZONE_Y

    ) {

      movePaddle(
        pos.x
      );

    }

  }
);


/* ==============================
   Pointer Up
============================== */

canvas.addEventListener(
  "pointerup",
  (event) => {

    if (

      controlPointerId ===
      event.pointerId

    ) {

      if (
        canvas.hasPointerCapture(
          event.pointerId
        )
      ) {

        canvas.releasePointerCapture(
          event.pointerId
        );

      }


      controlPointerId = null;

    }

  }
);


/* ==============================
   Pointer Cancel
============================== */

canvas.addEventListener(
  "pointercancel",
  (event) => {

    if (

      controlPointerId ===
      event.pointerId

    ) {

      controlPointerId = null;

    }

  }
);

</script>

</body>
</html>
